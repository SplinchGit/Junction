name: Publish Android to Play Internal Testing

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: junction-play-internal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-internal:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xmx3g
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.JUNCTION_RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.JUNCTION_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.JUNCTION_RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check Play publishing configuration
        id: configured
        shell: bash
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ] && [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Play publishing is not configured; add the documented repository secrets to enable trusted Play updates."
          fi

      - name: Checkout
        if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Java
        if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Materialize release credentials
        if: steps.configured.outputs.ready == 'true'
        shell: bash
        run: |
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/junction-upload.jks"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/google-play-service-account.json"
          chmod 600 "$RUNNER_TEMP/junction-upload.jks" "$RUNNER_TEMP/google-play-service-account.json"

      - name: Build signed release bundle
        if: steps.configured.outputs.ready == 'true'
        env:
          JUNCTION_RELEASE_STORE_FILE: ${{ runner.temp }}/junction-upload.jks
          JUNCTION_RELEASE_STORE_PASSWORD: ${{ secrets.JUNCTION_RELEASE_STORE_PASSWORD }}
          JUNCTION_RELEASE_KEY_ALIAS: ${{ secrets.JUNCTION_RELEASE_KEY_ALIAS }}
          JUNCTION_RELEASE_KEY_PASSWORD: ${{ secrets.JUNCTION_RELEASE_KEY_PASSWORD }}
          JUNCTION_VERSION_CODE: ${{ github.run_number }}
          JUNCTION_BUILD_NUMBER: ${{ github.run_number }}
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload to Play internal track
        if: steps.configured.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: ${{ runner.temp }}/google-play-service-account.json
          packageName: com.splinch.junction
          releaseFiles: apps/android/build/outputs/bundle/release/app-release.aab
          tracks: internal
          status: completed

      - name: Retain release bundle
        if: steps.configured.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: junction-play-release
          path: apps/android/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
