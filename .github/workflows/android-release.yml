name: Android Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.5.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # §4.2 "CI must be green; the injection test suite is a required check" —
  # a release cannot be cut without this job passing first, which runs the
  # exact same instrumentation suite (including InjectionTestSuite) as
  # android-ci.yml.
  verify:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Run instrumentation test suite (includes InjectionTestSuite)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --no-daemon

  publish:
    runs-on: ubuntu-latest
    needs: verify
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      JUNCTION_RELEASE_STORE_FILE: app/release.keystore
      JUNCTION_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      JUNCTION_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      JUNCTION_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$JUNCTION_RELEASE_STORE_PASSWORD"
          test -n "$JUNCTION_RELEASE_KEY_ALIAS"
          test -n "$JUNCTION_RELEASE_KEY_PASSWORD"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Create checksum assets
        run: |
          asset="junction-${RELEASE_TAG#v}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$asset"
          sha256sum "$asset" > "$asset.sha256"
          echo "APK_ASSET=$asset" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$APK_ASSET" "$APK_ASSET.sha256" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "Junction $RELEASE_TAG"