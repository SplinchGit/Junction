name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write
  packages: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      JAVA_TOOL_OPTIONS: -Xmx3g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Write google-services.json if provided (runtime check)
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "Writing google-services.json from secret"
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > app/google-services.json
          else
            echo "No GOOGLE_SERVICES_JSON provided; skipping"
          fi

      - name: Write local.properties overrides (from secrets)
        run: |
          echo "Creating local.properties overrides"
          if [ -n "${{ secrets.JUNCTION_WEB_CLIENT_ID }}" ]; then
            echo "JUNCTION_WEB_CLIENT_ID=${{ secrets.JUNCTION_WEB_CLIENT_ID }}" >> local.properties
          else
            echo "JUNCTION_WEB_CLIENT_ID=debug-placeholder-web-client-id" >> local.properties
            echo "Note: JUNCTION_WEB_CLIENT_ID secret not provided; using debug placeholder"
          fi
          if [ -n "${{ secrets.JUNCTION_REALTIME_ENDPOINT }}" ]; then
            echo "JUNCTION_REALTIME_ENDPOINT=${{ secrets.JUNCTION_REALTIME_ENDPOINT }}" >> local.properties
          fi
          if [ -n "${{ secrets.JUNCTION_REALTIME_CLIENT_SECRET_ENDPOINT }}" ]; then
            echo "JUNCTION_REALTIME_CLIENT_SECRET_ENDPOINT=${{ secrets.JUNCTION_REALTIME_CLIENT_SECRET_ENDPOINT }}" >> local.properties
          fi
          if [ -n "${{ secrets.JUNCTION_API_BASE_URL }}" ]; then
            echo "JUNCTION_API_BASE_URL=${{ secrets.JUNCTION_API_BASE_URL }}" >> local.properties
          fi

      - name: Write debug keystore from secret
        run: |
          if [ -n "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > app/debug.keystore
            echo "Wrote app/debug.keystore from ANDROID_DEBUG_KEYSTORE_BASE64"
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_BASE64 is not set. app/build.gradle.kts falls back to the runner's auto-generated debug keystore, which is regenerated on every run. The published APK will be signed with a key nobody has seen before, so it CANNOT update an existing install -- Android will refuse it until the app is uninstalled, wiping API keys, chat history and durable memory. Set the secret to make published builds updatable."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK (capture logs even on failure)
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace > build.log 2>&1 || true
          echo "==== build.log tail ===="
          tail -n 200 build.log || true

      - name: Collect APK into workspace root (if produced)
        run: |
          APK=$(find app/build/outputs/apk/debug -type f -name "*.apk" | head -n1 || true)
          if [ -n "$APK" ]; then
            echo "Found APK at: $APK"
            cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"
          else
            echo "No debug APK found"
            exit 1
          fi

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app-debug.apk

  publish-pages:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-debug.apk

      - name: Find downloaded APK
        id: find_apk
        run: |
          APK_PATH=$(find . -type f -name "*-debug.apk" -o -name "app-debug.apk" | head -n1 || true)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Build download page
        if: steps.find_apk.outputs.APK_PATH != ''
        run: |
          set -euo pipefail
          mkdir -p site
          cp "${{ steps.find_apk.outputs.APK_PATH }}" site/junction-debug.apk

          SHA256=$(sha256sum site/junction-debug.apk | awk '{print $1}')
          echo "$SHA256  junction-debug.apk" > site/junction-debug.apk.sha256

          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          REPO="${GITHUB_REPOSITORY}"

          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Junction — Download</title>
          <style>
            :root { color-scheme: dark; }
            body {
              font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
              margin: 0;
              min-height: 100vh;
              display: flex;
              align-items: center;
              justify-content: center;
              background: #0f1115;
              color: #f2f2f2;
              padding: 24px;
              box-sizing: border-box;
            }
            .card {
              max-width: 420px;
              width: 100%;
              background: #1a1d24;
              border-radius: 16px;
              padding: 32px 28px;
              box-shadow: 0 10px 30px rgba(0,0,0,0.3);
              text-align: center;
            }
            h1 { margin: 0 0 4px; font-size: 1.6rem; }
            .sub { color: #9aa0ac; margin: 0 0 24px; font-size: 0.9rem; }
            .btn {
              display: block;
              width: 100%;
              padding: 16px;
              background: linear-gradient(135deg,#4f7cff,#7b5cff);
              color: white;
              text-decoration: none;
              border-radius: 12px;
              font-weight: 600;
              font-size: 1.05rem;
              box-sizing: border-box;
            }
            .meta {
              margin-top: 20px;
              font-size: 0.8rem;
              color: #7d8390;
              line-height: 1.6;
              text-align: left;
              background: #12151b;
              border-radius: 10px;
              padding: 12px 16px;
              word-break: break-all;
            }
            .meta code { color: #c7d0e0; }
            a.commit { color: #8ab4ff; text-decoration: none; }
            .note { margin-top: 18px; font-size: 0.78rem; color: #6b7280; }
          </style>
          </head>
          <body>
            <div class="card">
              <h1>Junction</h1>
              <p class="sub">Latest debug build — updates automatically on every push to main</p>
              <a class="btn" href="junction-debug.apk" download>Download APK</a>
              <div class="meta">
                Version: ${VERSION_NAME} (build ${SHORT_SHA})<br>
                Built: ${BUILD_DATE}<br>
                Commit: <a class="commit" href="https://github.com/${REPO}/commit/${FULL_SHA}">${SHORT_SHA}</a><br>
                SHA-256: <code>${SHA256}</code>
              </div>
              <p class="note">On Android, allow "install from unknown sources" for your browser the first time you install.</p>
            </div>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: steps.find_apk.outputs.APK_PATH != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.find_apk.outputs.APK_PATH != ''
        id: deployment
        uses: actions/deploy-pages@v4
