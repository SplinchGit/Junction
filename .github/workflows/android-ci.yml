name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}-${{ hashFiles('**/*.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Optional build inputs. All of them are optional by design (spec 0.4): the app
      # must build and run with no Google account and no google-services.json, so a
      # missing secret produces a blank BuildConfig field rather than a build failure.
      - name: Write local.properties from secrets
        run: |
          : > local.properties
          for VAR in JUNCTION_WEB_CLIENT_ID JUNCTION_REALTIME_ENDPOINT \
                     JUNCTION_REALTIME_CLIENT_SECRET_ENDPOINT JUNCTION_API_BASE_URL; do
            VALUE="${!VAR}"
            if [ -n "$VALUE" ]; then
              echo "$VAR=$VALUE" >> local.properties
            else
              echo "Note: $VAR not configured; feature will report as unconfigured at runtime"
            fi
          done
        env:
          JUNCTION_WEB_CLIENT_ID: ${{ secrets.JUNCTION_WEB_CLIENT_ID }}
          JUNCTION_REALTIME_ENDPOINT: ${{ secrets.JUNCTION_REALTIME_ENDPOINT }}
          JUNCTION_REALTIME_CLIENT_SECRET_ENDPOINT: ${{ secrets.JUNCTION_REALTIME_CLIENT_SECRET_ENDPOINT }}
          JUNCTION_API_BASE_URL: ${{ secrets.JUNCTION_API_BASE_URL }}

      # The ubuntu-latest image ships an Android SDK at $ANDROID_HOME; install only the
      # pieces this project actually needs, matched to compileSdk/targetSdk in app/build.gradle.kts.
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # The injection test suite (spec 1.6) runs here. A regression fails the build.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  instrumentation-tests:
    runs-on: macos-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run instrumentation test suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew connectedDebugAndroidTest --no-daemon
